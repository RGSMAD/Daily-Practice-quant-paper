# ============================================================
# Daily Aptitude Generator Configuration
# ============================================================


# ============================================================
# Application
# ============================================================

app:
  app_name: "Daily Aptitude Generator"
  version: "1.0.0"
  timezone: "Asia/Kolkata"



# ============================================================
# PDF Configuration
# ============================================================

pdf:
  title: "Daily Aptitude Practice"
  author: "Daily Aptitude Generator"
  subject: "Quantitative Aptitude"

  font_name: "DejaVuSans"
  font_bold: "DejaVuSans-Bold"

  font_size: 11
  heading_size: 18
  line_spacing: 20
  margin: 40

  show_page_numbers: true

  include_logo: true
  logo_name: "logo.png"

  question_pdf_name: "Daily_Practice.pdf"
  answer_pdf_name: "Daily_Practice_Answers.pdf"



# ============================================================
# Question Configuration
# ============================================================

questions:

  # Number practice
  square_questions: 10
  cube_questions: 10


  # Root practice
  square_root_questions: 10
  cube_root_questions: 10


  # Square root distribution
  perfect_square_roots: 8
  non_perfect_square_roots: 2


  # Simplification practice
  simplification_questions: 20


  # Number series
  series_questions: 15



# ============================================================
# Number Range Configuration
# ============================================================

ranges:


  # Squares
  square_min: 10
  square_max: 500


  # Cubes
  cube_min: 10
  cube_max: 250


  # Perfect square roots
  perfect_square_root_min: 10
  perfect_square_root_max: 300


  # Perfect cube roots
  perfect_cube_root_min: 2
  perfect_cube_root_max: 100


  # Simplification operands
  simplification_min_operand: 10
  simplification_max_operand: 500


  # Series
  series_min_start: 1
  series_max_start: 100



# ============================================================
# Difficulty Distribution
# ============================================================

difficulty:

  easy_percentage: 40
  medium_percentage: 40
  hard_percentage: 20



# ============================================================
# Email Configuration
# ============================================================

email:

  smtp_server: "smtp.gmail.com"
  smtp_port: 587

  use_tls: true

  subject: "Daily Aptitude Practice"

  body: |
    Hello,

    Please find today's aptitude practice sheet attached.

    Happy Learning!

  sender_env: "EMAIL_USER"
  password_env: "EMAIL_PASSWORD"
  receiver_env: "RECEIVER_EMAIL"



# ============================================================
# History Configuration
# ============================================================

history:

  enabled: true

  active_file: "active.json"

  archive_directory: "archive"

  archive_monthly: true



# ============================================================
# Weekly Revision Configuration
# ============================================================

revision:

  enabled: true

  revision_day: "Sunday"

  questions_per_topic: 5



# ============================================================
# Logging Configuration
# ============================================================

logging:

  level: "INFO"

  filename: "generator.log"
