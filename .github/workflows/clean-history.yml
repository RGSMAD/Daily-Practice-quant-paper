name: Clean Aptitude History


on:
  schedule:
    # Runs every Sunday at 05:00 IST (23:30 UTC previous day)
    - cron: "30 23 * * 0"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  clean-history:

    name: Clean Question History

    runs-on: ubuntu-latest


    steps:

      # ---------------------------------------------
      # Checkout Repository
      # ---------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ---------------------------------------------
      # Python Setup
      # ---------------------------------------------

      - name: Set Up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ---------------------------------------------
      # Install Dependencies
      # ---------------------------------------------

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt


      # ---------------------------------------------
      # Clean History
      # ---------------------------------------------

      - name: Clean Question History
        run: |
          python -m src.utils.history_cleanup


      # ---------------------------------------------
      # Commit Changes
      # ---------------------------------------------

      - name: Commit Cleaned History

        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add history/questions_history.json


          git diff --cached --quiet || \
          git commit \
          -m "Clean aptitude question history"


          git push
